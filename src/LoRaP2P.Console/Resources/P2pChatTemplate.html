<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    body{margin:0;background:#efeae2;color:#111b21;font:15px system-ui,sans-serif}
    header{position:sticky;top:0;padding:16px;background:#075e54;color:white;box-shadow:0 1px 4px #777}
    header h1{margin:0;font-size:20px}
    header small{opacity:.85}
    main{max-width:900px;margin:auto;padding:20px}
    .row{display:flex;margin:8px 0}
    .incoming{justify-content:flex-start}
    .outgoing,.broadcast{justify-content:flex-end}
    .bubble{max-width:72%;padding:8px 11px;border-radius:10px;background:white;box-shadow:0 1px 1px #bbb}
    .outgoing .bubble{background:#d9fdd3}
    .broadcast .bubble{background:#fff3c4}
    .failed .bubble{border:2px solid #c62828}
    .meta{margin-top:5px;color:#667781;font-size:11px;text-align:right}
    .text{white-space:pre-wrap;overflow-wrap:anywhere}
    details{margin-top:6px;color:#54656f}
    code{white-space:pre-wrap;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <header>
    <h1>{{TITLE}}</h1>
    <small>{{SOURCE_FILE}}</small>
  </header>
  <main>
{{MESSAGES}}
  </main>
</body>
</html>
{{MESSAGE_TEMPLATE_BEGIN}}
    <div class="row {{CSS_CLASS}}">
      <article class="bubble">
        <strong>{{SENDER}}</strong>
        <div class="text">{{CONTENT}}</div>
        <details><summary>Hex-Payload</summary><code>{{HEX}}</code></details>
        <div class="meta">{{META}}</div>
      </article>
    </div>
{{MESSAGE_TEMPLATE_END}}
